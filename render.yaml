services:
  - type: web
    name: rk-connekt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: rk_connekt
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
